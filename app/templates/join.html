<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join the playgroup</title><link rel="stylesheet" href="/static/app.css"></head><body><main style="max-width:600px;margin:auto"><h1>Your seat at the table.</h1><p>Create your player login, or reset it using a fresh invitation from your administrator.</p><form method="post" action="/join" id="join-form"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="token" id="join-token"><label>Username<input name="username" required minlength="3" maxlength="40" pattern="[a-z0-9_.-]+" autocomplete="username" autocapitalize="none"></label><label>Password<input name="password" type="password" required minlength="12" maxlength="1024" autocomplete="new-password"></label><p>Use at least 12 characters. For a reset, keep your existing username or choose a new available one.</p><button class="button primary">Set up login</button><p id="join-message" role="alert"></p></form><p><a href="/login">Back to sign in</a></p></main><script src="/static/join.js" defer></script></body></html>
