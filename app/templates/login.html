<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10151b"><link rel="stylesheet" href="/static/app.css"><title>Sign in · Commander Ledger</title><link rel="stylesheet" href="/static/mobile-ui.css?v=7"><script src="/static/mobile-ui.js?v=7" defer></script></head><body><main style="max-width:500px;margin:10vh auto;padding:24px"><p class="eyebrow">YOUR PRIVATE COMMAND ZONE</p><h1>Welcome back.</h1><p class="subtitle">Sign in to record games and see your playgroup.</p><section class="panel" style="margin-top:28px"><form method="post" action="/login"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Username<input name="username" autocomplete="username" placeholder="Leave blank for administrator" maxlength="80"></label><label>Password<input type="password" name="password" autocomplete="current-password" required maxlength="1024" autofocus></label>{% if message %}<p class="error" role="alert">{{ message }}</p>{% endif %}<button type="submit" class="button primary">Sign in →</button></form></section><p class="muted">Use your player username, or leave it blank to sign in as administrator.</p><p id="login-status" role="status"></p></main><script src="/static/login.js" defer></script></body></html>
