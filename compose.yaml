services:
  ledger:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      COMMANDER_MODE: hosted
      COMMANDER_DB: /data/commander.db
      COMMANDER_BACKUPS: /data/backups
      COMMANDER_PASSWORD_HASH: ${COMMANDER_PASSWORD_HASH:?Set a password hash}
      COMMANDER_PUBLIC_URL: ${COMMANDER_PUBLIC_URL:?Set your HTTPS origin}
    volumes:
      - ledger-data:/data
    restart: unless-stopped
volumes:
  ledger-data:
